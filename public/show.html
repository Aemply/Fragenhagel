<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fragenhagel Show</title><link rel="stylesheet" href="/style.css"><style>
body{overflow:hidden}.showwrap{height:100vh;display:flex;flex-direction:column;padding:18px}.scorebar{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}.scorebar .score{min-width:150px;text-align:center}.showstage{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}.showstage>div{width:100%}.board{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;max-width:1450px;margin:auto}.board .cat{min-height:520px}.showbuzz{text-align:center;margin:10px auto;max-width:800px}.join{position:fixed;inset:0;display:grid;place-items:center;background:#070714;z-index:20}.joinbox{width:min(520px,90vw);text-align:center}.joinbox input{font-size:26px;padding:14px;width:100%;box-sizing:border-box;border-radius:12px;border:1px solid #ffffff33;background:#111126;color:white}.hidden{display:none!important}
</style>
<style id="face-morph-solution-style">
.face-morph-solution{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1.35fr) minmax(0,1fr);
  gap:24px;
  align-items:center;
  width:min(1200px,94vw);
  margin:24px auto;
}
.face-morph-solution .fm-original,
.face-morph-solution .fm-morph{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
}
.face-morph-solution img{
  display:block;
  max-width:100%;
  max-height:58vh;
  object-fit:contain;
  border-radius:14px;
}
.face-morph-solution .fm-original img{
  max-height:42vh;
}
.face-morph-solution .fm-label{
  font-size:clamp(16px,2vw,26px);
  font-weight:800;
  opacity:.9;
}
@media(max-width:800px){
  .face-morph-solution{grid-template-columns:1fr;gap:16px}
  .face-morph-solution .fm-original{display:grid;grid-template-columns:1fr 1fr;width:100%}
}
</style>

</head><body>
<button id="soundToggle" onclick="toggleSound()" title="Sound an/aus" style="position:fixed;right:12px;bottom:12px;z-index:99;border:1px solid #ffffff33;background:#111126;color:white;border-radius:999px;padding:8px 11px;cursor:pointer">🔊</button>
<div id="join" class="join"><div class="joinbox panel"><h1 class="neon">⚡ FRAGENHAGEL SHOW</h1><p>Spielcode eingeben, um die Show zu verbinden.</p><input id="code" maxlength="5" placeholder="z. B. K7XM2"><button class="btn cyan" style="margin-top:12px" onclick="connectGame()">📺 Verbinden</button><div id="joinStatus" class="small"></div></div></div>
<div class="showwrap"><div id="scores" class="scorebar"></div><div id="buzz" class="buzz showbuzz">Buzzer geschlossen</div><div id="stage" class="showstage"></div></div>
<script src="/socket.io/socket.io.js">
function renderFaceMorphSolution(data){
  const morph = data?.morph || data?.bild || data?.image || data?.src || '';
  const original1 = data?.original1 || data?.bild1 || data?.image1 || data?.left || '';
  const original2 = data?.original2 || data?.bild2 || data?.image2 || data?.right || '';
  if(!morph) return '';
  return `<div class="face-morph-solution">
    <div class="fm-original">
      ${original1 ? `<img src="${original1}" alt="Originalbild 1">` : ''}
      <div class="fm-label">Originalbild 1</div>
    </div>
    <div class="fm-morph">
      <img src="${morph}" alt="Morph-Bild">
      <div class="fm-label">Morph</div>
    </div>
    <div class="fm-original">
      ${original2 ? `<img src="${original2}" alt="Originalbild 2">` : ''}
      <div class="fm-label">Originalbild 2</div>
    </div>
  </div>`;
}


function enhanceFaceMorphSolution(){
  try{
    const isFaceMorph = String(state?.special?.type || active?.type || '').toLowerCase().includes('face morph');
    const revealed = !!(state?.revealed || active?.revealed);
    if(!isFaceMorph || !revealed) return;

    const data = state?.special || active || {};
    const morph = data.morph || data.morphImage || data.bild || data.image || data.src || '';
    const original1 = data.original1 || data.originalImage1 || data.bild1 || data.image1 || '';
    const original2 = data.original2 || data.originalImage2 || data.bild2 || data.image2 || '';
    if(!morph || (!original1 && !original2)) return;

    const imgs = [...document.querySelectorAll('img')];
    const morphImg = imgs.find(img => img.src === morph || img.alt?.toLowerCase().includes('morph'));
    if(!morphImg || document.querySelector('.face-morph-solution')) return;

    const wrap = morphImg.closest('.special, .stage, .card, .panel, div') || morphImg.parentElement;
    if(!wrap) return;

    const box = document.createElement('div');
    box.className='face-morph-solution';
    box.innerHTML = `
      <div class="fm-original">
        ${original1 ? `<img src="${original1}" alt="Originalbild 1">` : ''}
        <div class="fm-label">Originalbild 1</div>
      </div>
      <div class="fm-morph">
        <img src="${morphImg.src}" alt="Morph-Bild">
        <div class="fm-label">Morph</div>
      </div>
      <div class="fm-original">
        ${original2 ? `<img src="${original2}" alt="Originalbild 2">` : ''}
        <div class="fm-label">Originalbild 2</div>
      </div>`;
    wrap.replaceChildren(box);
  }catch(e){
    console.error('Face-Morph-Lösung konnte nicht erweitert werden:',e);
  }
}

</script><script>
let soundOn=localStorage.getItem('fragenhagelSound')!=='off',audioCtx=null;
function ac(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function tone(freq,dur=.12,type='sine',vol=.08,delay=0){if(!soundOn)return;try{const c=ac(),o=c.createOscillator(),g=c.createGain(),now=c.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(vol,now+.01);g.gain.exponentialRampToValueAtTime(.0001,now+dur);o.connect(g);g.connect(c.destination);o.start(now);o.stop(now+dur+.03)}catch(e){}}
function sBuzz(){tone(180,.09,'square',.10);tone(120,.16,'square',.08,.08)}function sOpen(){tone(520,.09,'sine',.07);tone(760,.13,'sine',.07,.09)}function sReveal(){tone(440,.10,'triangle',.07);tone(660,.10,'triangle',.07,.10);tone(880,.18,'triangle',.08,.20)}
function toggleSound(){soundOn=!soundOn;localStorage.setItem('fragenhagelSound',soundOn?'on':'off');document.getElementById('soundToggle').textContent=soundOn?'🔊':'🔇';if(soundOn)sOpen()}
document.addEventListener('pointerdown',()=>{if(soundOn)ac()},{once:true});
const socket=io();let state={},Q={},code=new URLSearchParams(location.search).get('code')||localStorage.getItem('fragenhagelShowCode')||'';let prev={buzzerOpen:false,buzzedBy:null,revealed:false};
const cats=['YouTube-Titel','Back to School','Was bin ich?','Filme & Serien','Musik','Flaggen'];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const img=u=>u?u+'?v=1':'';
function connectGame(){code=document.getElementById('code').value.trim().toUpperCase();if(!code)return;localStorage.setItem('fragenhagelShowCode',code);socket.emit('watchGame',{code})}
if(code){document.getElementById('code').value=code;connectGame()}
socket.on('errorMessage',m=>document.getElementById('joinStatus').textContent=m);
socket.on('connect',()=>{if(code)socket.emit('watchGame',{code})});
socket.on('state',s=>{state=s||{};document.getElementById('join').classList.add('hidden');const rev=state.mode==='question'?state.question?.revealed:state.mode==='special'?state.special?.revealed:false;if(state.buzzedBy&&state.buzzedBy!==prev.buzzedBy)sBuzz();else if(state.buzzerOpen&&!prev.buzzerOpen)sOpen();if(rev&&!prev.revealed)sReveal();prev={buzzerOpen:!!state.buzzerOpen,buzzedBy:state.buzzedBy||null,revealed:!!rev};render()});enhanceFaceMorphSolution();
socket.on('questionsUpdated',q=>{Q=q;render()});
async function load(){Q=await fetch('/api/questions?x='+Date.now(),{cache:'no-store'}).then(r=>r.json());render()}
function render(){const ps=state.players||[];document.getElementById('scores').innerHTML=ps.map(p=>`<div class="score"><strong>${esc(p.name)}: ${p.score??0}</strong></div>`).join('');const b=document.getElementById('buzz');b.textContent=state.buzzedBy?'⚡ '+state.buzzedBy+' hat gebuzzert!':state.buzzerOpen?'🟢 BUZZER OFFEN':'🔴 Buzzer geschlossen';b.className='buzz showbuzz'+(state.buzzerOpen?' open':'');const stage=document.getElementById('stage');if(state.mode==='question'&&state.question){let x=state.question;stage.innerHTML=`<div><div class="small">${esc(x.kategorie)} · ${esc(x.punkte)} Punkte</div><div class="question">${esc(x.frage)}</div>${x.revealed?`<div class="answer"><div class="small">LÖSUNG</div>${esc(x.antwort)}</div>`:''}</div>`;return}if(state.mode==='special'&&state.special){stage.innerHTML=special(state.special);return}stage.innerHTML=board()}
function board(){return `<div class="board">${cats.map(c=>`<div class="cat"><h3>${esc(c)}</h3>${(Q[c]||[]).map(x=>`<div class="tile ${x.used?'used':''}">${x.used?'✓':esc(x.punkte)}</div>`).join('')}</div>`).join('')}</div>`}
function special(x){const t=x.type;if(t==='Face Morph')return `<div><h2 class="neon">FACE MORPH</h2>${x.bild?`<img class="heroimg" src="${img(x.bild)}">`:'<div class="question">Noch kein Morphbild</div>'}${x.revealed?`<div class="answer">${esc(x.person1)} + ${esc(x.person2)}</div><div class="originals">${x.original1?`<figure><img src="${img(x.original1)}"><figcaption>${esc(x.person1)}</figcaption></figure>`:''}${x.original2?`<figure><img src="${img(x.original2)}"><figcaption>${esc(x.person2)}</figcaption></figure>`:''}</div>`:''}</div>`;if(t==='Wo zum Henker ist das?')return `<div><h2 class="neon">WO ZUM HENKER IST DAS?</h2>${x.bild?`<img class="heroimg" src="${img(x.bild)}">`:'<div class="question">Noch kein Geo-Bild</div>'}${x.revealed?`<div class="answer">📍 ${esc(x.antwort)}</div>`:''}</div>`;if(t==='Fragenhagel')return `<div><h2 class="neon">FRAGENHAGEL · ${esc(x.punkte||100)} PUNKTE</h2><div class="question">${esc(x.frage||'Noch keine Frage')}</div>${x.revealed?`<div class="answer">${esc(x.antwort||'')}</div>`:''}</div>`;if(t==='Musik')return `<div><h2 class="neon">MUSIK · ${esc(x.punkte||300)} PUNKTE</h2><div class="question">🎵 Welches Lied ist das?</div>${x.revealed?`<div class="answer">${esc(x.antwort||'')}</div>`:''}</div>`;return '<div class="question">Sonderrunde</div>'}
load();
</script></body></html>
