<script src="https://sdk.scdn.co/spotify-player.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
let soundOn=localStorage.getItem('fragenhagelSound')!=='off';
let audioCtx=null;
function ac(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function tone(freq,dur=.12,type='sine',vol=.08,delay=0){if(!soundOn)return;try{const c=ac(),o=c.createOscillator(),g=c.createGain(),now=c.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(0.0001,now);g.gain.exponentialRampToValueAtTime(vol,now+.01);g.gain.exponentialRampToValueAtTime(0.0001,now+dur);o.connect(g);g.connect(c.destination);o.start(now);o.stop(now+dur+.03)}catch(e){}}
function sBuzz(){tone(180,.09,'square',.10);tone(120,.16,'square',.08,.08)}
function sOpen(){tone(520,.09,'sine',.07);tone(760,.13,'sine',.07,.09)}
function sReveal(){tone(440,.10,'triangle',.07);tone(660,.10,'triangle',.07,.10);tone(880,.18,'triangle',.08,.20)}
function sCorrect(){tone(523,.10,'sine',.07);tone(659,.10,'sine',.07,.10);tone(784,.22,'sine',.08,.20)}
function sWrong(){tone(220,.15,'sawtooth',.06);tone(165,.25,'sawtooth',.06,.13)}
function toggleSound(){soundOn=!soundOn;localStorage.setItem('fragenhagelSound',soundOn?'on':'off');const b=document.getElementById('soundToggle');if(b)b.textContent=soundOn?'🔊':'🔇';if(soundOn)sOpen()}
document.addEventListener('pointerdown',()=>{if(soundOn)ac()},{once:true});
setTimeout(()=>{const b=document.getElementById('soundToggle');if(b)b.textContent=soundOn?'🔊':'🔇'},0);
let prevSoundState={buzzerOpen:false,buzzedBy:null,mode:null,revealed:false};
function stateSounds(x){
 if(!x)return;
 if(x.buzzedBy && x.buzzedBy!==prevSoundState.buzzedBy)sBuzz();
 else if(x.buzzerOpen && !prevSoundState.buzzerOpen)sOpen();
 const revealed=(x.mode==='question'?x.question?.revealed:x.mode==='special'?x.special?.revealed:false);
 if(revealed&&!prevSoundState.revealed)sReveal();
 prevSoundState={buzzerOpen:!!x.buzzerOpen,buzzedBy:x.buzzedBy||null,mode:x.mode,revealed:!!revealed};
}

const socket=io(); let Q={}; let state={};
let judgedPlayers={};
 let active=null; const urlCode=new URLSearchParams(location.search).get('code')||'';
const storedGameCode=localStorage.getItem('fragenhagelGameCode')||'';
let gameCode=urlCode||storedGameCode;
let hostToken=(urlCode&&urlCode!==storedGameCode)?'':(localStorage.getItem('fragenhagelHostToken')||'');
let creatingNewLobby=false;
const gameHeaders=()=>({'Content-Type':'application/json','x-game-code':gameCode,'x-host-token':hostToken});
function openShow(){if(!gameCode)return alert('Spiel wird noch erstellt.');window.open('/show.html?code='+encodeURIComponent(gameCode),'show')}
function playerLink(){return location.origin+'/player.html?code='+encodeURIComponent(gameCode)}
async function copyPlayerLink(){if(!gameCode)return;try{await navigator.clipboard.writeText(playerLink());document.getElementById('joinHint').textContent='Spieler-Link kopiert: '+playerLink()}catch(e){prompt('Spieler-Link',playerLink())}}
function createOrJoin(){
  if(gameCode&&hostToken){
    socket.emit('hostJoin',{code:gameCode,hostToken});
    return;
  }
  socket.emit('createGame');
}

function setHostUrl(code){
  const url=new URL(location.href);
  if(code) url.searchParams.set('code',code);
  else url.searchParams.delete('code');
  history.replaceState(null,'',url.pathname+(url.search?url.search:''));
}

function newLobby(){
  if(!confirm('Neue Lobby erstellen? Die aktuelle Lobby bleibt für bereits verbundene Spieler bestehen, aber dieser Host wechselt in eine neue Lobby.')) return;
  creatingNewLobby=true;
  gameCode='';
  hostToken='';
  state={};
  active=null;
  localStorage.removeItem('fragenhagelGameCode');
  localStorage.removeItem('fragenhagelHostToken');
  setHostUrl('');
  const info=document.getElementById('gameInfo');
  if(info) info.textContent='Neue Lobby wird erstellt …';
  const hint=document.getElementById('joinHint');
  if(hint) hint.textContent='';
  socket.emit('createGame');
}

const cats=['YouTube-Titel','Back to School','Was bin ich?','Filme & Serien','Musik','Flaggen'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img=u=>u?u+'?v='+Date.now():'';
socket.on('state',s=>{
  const previousBuzzed=state?.buzzedBy||null;
  stateSounds(s);
  state=s||{};
  // Nach einem Spotify-Login wird die Hostseite neu geladen. Der Server kennt
  // weiterhin die aktuell geöffnete Sonderrunde, daher stellen wir diese Ansicht
  // automatisch wieder her, statt auf dem Hauptbrett zu landen.
  const restoreMusic=new URLSearchParams(location.search).get('restore')==='music';
  if(!active && state.mode==='special' && state.special){
    active={...state.special};
    if(active.type==='Musik' && active.spotifyUrl && !active.spotify) active.spotify=active.spotifyUrl;
    setTimeout(()=>{ if(active) { if(restoreMusic && active.type==='Musik') document.getElementById('play')?.classList.add('open'); renderPlay(); } },0);
  } else if(restoreMusic && active?.type==='Musik'){
    document.getElementById('play')?.classList.add('open');
    setTimeout(()=>renderPlay(),0);
  }
  if(active?.type==='Musik' && state.buzzedBy && state.buzzedBy!==previousBuzzed && musicPlayerReady && musicPlayer && musicPlaying){
    musicPlayer.pause().then(()=>{
      musicPlaying=false;
      stopMusicTicker();
      musicUiUpdate(musicCurrentTime,musicDuration,false);
    }).catch(()=>{});
  }
  renderScores();
  renderBuzz();
  renderHostBuzz();
  renderLobby();

  // The judgement buttons are driven by the current server-side buzzer.
  // They appear immediately when buzzedBy is set and disappear when it is cleared.
  const j=document.getElementById('judge');
  if(active){
    if(state.buzzedBy) renderJudge(Number(active.punkte)||100);
    else if(j) j.innerHTML='';
  }else if(j){
    j.innerHTML='';
  }
});
socket.on('buzzAccepted', ({player})=>{
  if(!player)return;
  state.buzzedBy=player;
  renderBuzz();
  renderHostBuzz();
  if(active) renderJudge(Number(active.punkte)||100);
  // Musik: Sobald ein Spieler buzzert, pausiert der Host-Player automatisch.
  if(active?.type==='Musik' && musicPlayerReady && musicPlayer && musicPlaying){
    musicPlayer.pause().then(()=>{
      musicPlaying=false;
      stopMusicTicker();
      musicUiUpdate(musicCurrentTime,musicDuration,false);
    }).catch(()=>{});
  }
});
socket.on('gameCreated',g=>{
  gameCode=g.code;
  hostToken=g.hostToken;
  setHostUrl(gameCode);
  creatingNewLobby=false;
  localStorage.setItem('fragenhagelGameCode',gameCode);
  localStorage.setItem('fragenhagelHostToken',hostToken);
  state={code:gameCode,players:[],mode:'board',question:null,special:null,buzzerOpen:false,buzzedBy:null,firstBuzzedBy:null,lockedPlayers:[]};
  updateGameInfo();
  renderScores();
  renderBuzz();
  renderLobby();
  renderAll();
});
socket.on('errorMessage',m=>{
  if(creatingNewLobby) return;
  localStorage.removeItem('fragenhagelGameCode');
  localStorage.removeItem('fragenhagelHostToken');
  gameCode='';
  hostToken='';
  alert(m);
  createOrJoin();
});
function updateGameInfo(){const el=document.getElementById('gameInfo');if(el)el.textContent=gameCode?'SPIELCODE: '+gameCode:'Spiel wird erstellt …';const h=document.getElementById('joinHint');if(h&&gameCode)h.textContent='Freunde öffnen '+playerLink()+' und geben den Spielcode '+gameCode+' ein.'}
function renderLobby(){const el=document.getElementById('lobby');if(!el)return;const ps=state.players||[];el.innerHTML=ps.length?ps.map(p=>`<span class="score"><strong>${esc(p.name)}</strong> ${p.connected?'🟢':'⚪'}</span>`).join(''):'<span class="small">Noch niemand beigetreten.</span>';updateGameInfo()}

socket.on('questionsUpdated',q=>{Q=q;renderAll();});
async function load(){Q=await fetch('/api/questions?x='+Date.now(),{cache:'no-store'}).then(r=>r.json());renderAll();updateGameInfo();if(active)renderPlay();}

function renderHostBuzz(){
  const nameEl=document.getElementById('hostBuzzName');
  const metaEl=document.getElementById('hostBuzzMeta');
  if(!nameEl || !metaEl) return;
  const current=state?.buzzedBy || null;

  // The visible indication is only for the currently active buzzer.
  // After Richtig/Falsch, buzzedBy is cleared, so the indication disappears.
  if(!current){
    nameEl.textContent='Noch niemand gebuzzert';
    nameEl.className='host-buzz-name waiting';
    metaEl.textContent=state?.buzzerOpen ? 'Buzzer ist geöffnet' : 'Buzzer ist geschlossen';
    return;
  }

  nameEl.textContent='🔔 '+current;
  nameEl.className='host-buzz-name active';
  metaEl.textContent = 'Hat gerade gebuzzert';
}

function renderScores(){const el=document.getElementById('scores');const ps=state.players||[];el.innerHTML=ps.map(p=>`<div class="score"><strong>${esc(p.name)}: ${p.score??0}</strong><div><button class="btn" onclick="pts(${JSON.stringify(p.name)},100)">+100</button><button class="btn" onclick="pts(${JSON.stringify(p.name)},-100)">-100</button></div></div>`).join('')}
function renderBuzz(){
 const b=document.getElementById('buzz');
 const hb=document.getElementById('hostBuzzed');
 const current=state?.buzzedBy || null;

 // Show a name only while a player is the current accepted buzzer.
 if(current){
   const text='⚡ '+current+' HAT GEBUZZERT!';
   b.textContent=text; b.className='buzz';
   if(hb){hb.style.display='block';hb.textContent=text;hb.className='buzz';}
 }else{
   // Important: after Richtig/Falsch the indication disappears.
   // If the buzzer is reopened after a wrong answer, it stays hidden
   // until the next player actually buzzes.
   b.textContent='🔴 Buzzer geschlossen';b.className='buzz';
   if(hb){hb.style.display='none';hb.textContent='';}
 }
}
function pts(p,a){socket.emit('addPoints',{player:p,amount:a})}function resetScores(){socket.emit('resetScores')}function openBuzzer(){
 socket.emit('openBuzzer');
 state.buzzedBy=null;
 renderBuzz();
 renderHostBuzz();
 const j=document.getElementById('judge');
 if(j)j.innerHTML='';
}function closeBuzzer(){socket.emit('closeBuzzer')}
function renderAll(){  renderHostBuzz();
renderBoard();renderMainEditor();renderFace();renderGeo();renderFH();renderMusic()}
async function resetUsed(){if(!confirm('Alle benutzten Felder wieder freigeben?'))return;await fetch('/api/reset-used',{method:'POST',headers:gameHeaders()});await load()}
function renderBoard(){document.getElementById('board').innerHTML=cats.map(c=>`<div class="cat"><h3>${esc(c)}</h3>${(Q[c]||[]).map((x,i)=>`<button class="tile ${x.used?'used':''}" onclick="startQuestion('${c.replaceAll("'","\\'")}',${i})">${x.used?'✓':esc(x.punkte)}</button>`).join('')}</div>`).join('')}
async function startQuestion(c,i){
 judgedPlayers={};
 const x=Q[c][i];if(x.used)return;x.used=true;renderBoard();fetch('/api/question-used',{method:'POST',headers:gameHeaders(),body:JSON.stringify({category:c,index:i,used:true})}).catch(()=>{});active={kind:'question',category:c,index:i,...x,revealed:false};socket.emit('showQuestion',{kategorie:c,punkte:x.punkte,frage:x.frage,antwort:x.antwort});showPlay()}
function showPlay(){document.getElementById('play').classList.add('open');renderPlay()}
function toBoard(){
 judgedPlayers={};
 judgingLocked=false;
 if(active?.type==='Musik'&&musicPlayerReady&&musicPlayer){try{socket.emit('musicControl',{action:'pause',time:musicPlayer.getCurrentTime()});}catch(e){}}
 resetMusicPlayer();
 document.getElementById('play').classList.remove('open');active=null;socket.emit('showBoard')}
let musicPlayer=null,musicPlayerId='',musicPlayerReady=false,musicTicker=null,musicPendingAction=null,musicCurrentTime=0,musicDuration=0,musicPlaying=false,spotifyDeviceId='',spotifySdkReady=false,spotifyAuth={authenticated:false,premium:false};
window.onSpotifyWebPlaybackSDKReady=()=>{spotifySdkReady=true;if(active?.type==='Musik') initSpotifyWebPlayer();};
function formatTime(sec){sec=Math.max(0,Math.floor(Number(sec)||0));const m=Math.floor(sec/60),s=String(sec%60).padStart(2,'0');return `${m}:${s}`}
function spotifyTrackUri(url){const v=String(url||'').trim();if(/^spotify:track:[A-Za-z0-9]+$/.test(v))return v;const m=v.match(/open\.spotify\.com\/(?:intl-[^/]+\/)?track\/([A-Za-z0-9]+)/i);return m?`spotify:track:${m[1]}`:'';}
async function loadSpotifyStatus(){try{const r=await fetch('/api/spotify/status');spotifyAuth=await r.json();const s=document.getElementById('spotifyStatus');if(s){if(spotifyAuth.authenticated&&spotifyAuth.premium)s.textContent=`🟢 Spotify Premium verbunden${spotifyAuth.displayName?' · '+spotifyAuth.displayName:''}`;else if(spotifyAuth.authenticated)s.textContent='🟠 Spotify verbunden, aber Premium erforderlich';else s.textContent='Nicht mit Spotify verbunden';}const b=document.getElementById('spotifyLoginBtn');if(b){b.textContent=spotifyAuth.authenticated?'🔄 Spotify neu anmelden':'🎵 Mit Spotify Premium anmelden';b.style.display='inline-block';}if(spotifyAuth.authenticated&&spotifyAuth.premium&&active?.type==='Musik')initSpotifyWebPlayer();}catch(e){}}
function spotifyLogin(){
  const u=new URL('/api/spotify/login',location.origin);
  const ret=new URL('/host.html',location.origin);
  if(gameCode) ret.searchParams.set('code',gameCode);
  if(active?.type==='Musik'){
    ret.searchParams.set('restore','music');
    ret.searchParams.set('musicIndex',String(Number(active.index)||0));
  }
  u.searchParams.set('return',ret.pathname+ret.search);
  window.location.href=u.toString();
}
async function initSpotifyWebPlayer(){if(!spotifyAuth.authenticated||!spotifyAuth.premium||!spotifySdkReady)return;if(musicPlayer)return;try{const tr=await fetch('/api/spotify/token');if(!tr.ok)throw new Error('Spotify-Anmeldung abgelaufen');const tj=await tr.json();musicPlayer=new Spotify.Player({name:'Fragenhagel Host Player',getOAuthToken:async cb=>{try{const r=await fetch('/api/spotify/token');const j=await r.json();cb(j.access_token||'')}catch(e){cb('')}},volume:1});musicPlayer.addListener('ready',({device_id})=>{spotifyDeviceId=device_id;musicPlayerReady=true;musicUiUpdate(musicCurrentTime,musicDuration,musicPlaying);if(musicPendingAction){const fn=musicPendingAction;musicPendingAction=null;fn();}});musicPlayer.addListener('not_ready',()=>{musicPlayerReady=false;spotifyDeviceId='';});musicPlayer.addListener('player_state_changed',state=>{if(!state)return;musicDuration=Number(state.duration||0)/1000;musicCurrentTime=Number(state.position||0)/1000;musicPlaying=!state.paused;musicPlayerId=state.track_window?.current_track?.uri||musicPlayerId;musicUiUpdate(musicCurrentTime,musicDuration,musicPlaying);if(musicPlaying)startMusicTicker();else stopMusicTicker();});musicPlayer.addListener('initialization_error',({message})=>{showMusicStatus('❌ Spotify Player: '+message)});musicPlayer.addListener('authentication_error',({message})=>{showMusicStatus('❌ Spotify-Anmeldung: '+message)});musicPlayer.addListener('account_error',({message})=>{showMusicStatus('❌ Spotify Premium wird benötigt');});musicPlayer.addListener('playback_error',({message})=>{showMusicStatus('❌ Wiedergabe: '+message)});musicPlayer.addListener('autoplay_failed',()=>{showMusicStatus('ℹ️ Zum Starten bitte Play drücken.');});await musicPlayer.connect();}catch(e){musicPlayer=null;musicPlayerReady=false;showMusicStatus('❌ '+e.message);}}
function showMusicStatus(msg){const el=document.getElementById('musicStatus');if(el)el.textContent=msg;}
function musicUiUpdate(time,duration,playing){const seek=document.getElementById('musicSeek'),tm=document.getElementById('musicTime'),btn=document.getElementById('musicPlayBtn');if(seek&&duration>0){seek.max=duration;seek.value=Math.min(duration,Math.max(0,Number(time)||0));}if(tm)tm.textContent=`${formatTime(time)} / ${formatTime(duration)}`;if(btn)btn.textContent=playing?'⏸️ Pause':'▶️ Play';}
function startMusicTicker(){if(musicTicker)return;musicTicker=setInterval(()=>{if(!musicPlayerReady||!musicPlayer||!musicPlaying)return;musicCurrentTime+=1;musicUiUpdate(musicCurrentTime,musicDuration,true);},1000)}

 else if(active.type==='Musik'){const id=String(active.spotify||'').trim();html=`<h2>Musik ${active.index+1}</h2><div class="question">Welches Lied ist das?</div>${id?`<div class="music-show-wrap"><div class="music-show-bar"><div class="music-spotify-login"><span id="spotifyStatus">Spotify wird geprüft …</span><button id="spotifyLoginBtn" class="btn cyan" type="button" onclick="spotifyLogin()">🎵 Mit Spotify Premium anmelden</button></div><div class="music-show-row"><button id="musicPlayBtn" class="btn good" type="button" onclick="musicToggle()">▶️ Play</button><input id="musicSeek" class="music-seek" type="range" min="0" max="100" step="0.1" value="0" oninput="musicSeekPreview(this.value)" onchange="musicSeekTo(this.value)"><span id="musicTime" class="music-show-time">0:00 / 0:00</span><div class="music-host-volume"><span>🔊</span><input id="musicVolume" type="range" min="0" max="100" value="100" oninput="musicSetVolume(this.value)"></div></div><div id="musicStatus" class="music-status">${esc(active.antwort||'')}</div></div></div>`:'<div class="small">Kein gültiger Spotify-Link</div>'}<div class="answer">${esc(active.antwort||'')}</div>`}
 if(active.type==='Musik'){document.getElementById('playContent').innerHTML=html;loadSpotifyStatus();if(spotifyAuth.authenticated&&spotifyAuth.premium)initSpotifyWebPlayer();}else{resetMusicPlayer();document.getElementById('playContent').innerHTML=html;} const nextFm=document.getElementById("nextFaceMorphBtn"); if(nextFm){const list=Q.Sonderrunden?.['Face Morph']||[]; const isFm=active?.type==='Face Morph'; nextFm.style.display=isFm?'inline-block':'none'; nextFm.disabled=!isFm || active.index>=list.length-1;} const nextSpecialBtn=document.getElementById("nextSpecialBtn"); if(nextSpecialBtn){const nextMap={"Wo zum Henker ist das?":{label:"➡️ Nächster Geo",type:"Wo zum Henker ist das?"},"Fragenhagel":{label:"➡️ Nächster Fragenhagel",type:"Fragenhagel"},"Musik":{label:"➡️ Nächste Musik",type:"Musik"}}; const cfg=nextMap[active?.type]; const list=cfg?(Q.Sonderrunden?.[cfg.type]||[]):[]; const show=!!cfg; nextSpecialBtn.style.display=show?'inline-block':'none'; nextSpecialBtn.textContent=cfg?.label||''; nextSpecialBtn.disabled=!show || Number(active.index)>=list.length-1;} if(state?.buzzedBy)renderJudge(points);else{const _j=document.getElementById("judge");if(_j)_j.innerHTML="";}

function renderJudge(points){
 const j=document.getElementById('judge');
 if(!j)return;
 const currentBuzz=state?.buzzedBy || null;
 j.innerHTML='';

 // Absolute rule: before somebody buzzes, there are NO judgement buttons.
 if(!currentBuzz)return;

 const ps=state.players||[];
 const p=ps.find(x=>String(x.name)===String(currentBuzz));
 if(!p)return;

 const val=Number(points)||100;

 const addBtn=(label, cls, fn)=>{
   const b=document.createElement('button');
   b.className='btn '+cls;
   b.type='button';
   b.textContent=label;
   b.dataset.player=String(p.name);
   b.disabled=!!judgedPlayers[String(p.name)];
   b.addEventListener('click',()=>{ if(!b.disabled) fn(); });
   j.appendChild(b);
 };

 if(active?.type==='Face Morph'){
   const hasPreviousWrong=Array.isArray(state?.lockedPlayers) && state.lockedPlayers.length>0;
   if(hasPreviousWrong){
     addBtn('👤 '+String(p.name)+' +100','good',()=>faceMorphSecondCorrect(p.name));
     addBtn('❌ Falsch – '+String(p.name),'bad',()=>faceMorphSecondWrong(p.name));
   }else{
     addBtn('👤 '+String(p.name)+' +100','good',()=>award(p.name,100));
     addBtn('👥 '+String(p.name)+' +300','good',()=>award(p.name,300));
   }
 }else{
   addBtn('✅ Richtig – '+String(p.name),'good',()=>correct(p.name,val));
   addBtn('❌ Falsch – '+String(p.name),'bad',()=>wrong(p.name,val));
 }
}
function lockPlayerButtons(p){
 const key=String(p);
 judgedPlayers[key]=true;
 const j=document.getElementById('judge');
 if(!j)return;
 // Disable only the two judgement buttons belonging to this player.
 // Other players remain fully clickable after a wrong answer.
 const buttons=[...j.querySelectorAll('button')];
 buttons.filter(b=>b.dataset.player===key).forEach(b=>b.disabled=true);
}

function correct(p,v){
 if(judgedPlayers[String(p)])return;
 lockPlayerButtons(p);
 try{sCorrect()}catch(e){}
 socket.emit('correct',{player:String(p),points:Number(v)||100});

 // Use the same reveal() function as the visible button.
 // The delay lets the correct-answer state reach the server first.
 setTimeout(()=>{
   try{
     if(typeof reveal === 'function') reveal();

     console.error('Automatisches Anzeigen der Lösung fehlgeschlagen:',e);

 },250);

function award(p,v){
 if(judgedPlayers[String(p)])return;
 lockPlayerButtons(p);
 const pts=Number(v)||0;
 if(pts===100){
   // Face Morph: +100 is still a wrong answer.
   // The player keeps the 100 points, but is locked out and the buzzer reopens for others.
   try{sWrong()}catch(e){}
   socket.emit('faceMorphPartial',{player:String(p),points:100});
 }else if(pts===300){
   // Face Morph: +300 ends the question and automatically reveals the solution.
   try{sCorrect()}catch(e){}
   socket.emit('correct',{player:String(p),points:300});
   setTimeout(()=>{
     try{

     }catch(e){

     }

 }
}

async function spotifyAutofill(index,input){
 const url=String(input?.value||'').trim();

 if(!answer)return;

   answer.placeholder='Spotify-Daten werden geladen …';
   const r=await fetch('/api/spotify/track-metadata?url='+encodeURIComponent(url));
   const j=await r.json().catch(()=>({}));
   if(!r.ok)throw new Error(j.error||'Spotify-Daten konnten nicht geladen werden');
   answer.value=j.answer||'';
   Q.Sonderrunden.Musik[index].spotify=url;
   Q.Sonderrunden.Musik[index].antwort=j.answer||'';
   answer.placeholder='Lied / Interpret';
 }catch(e){
   answer.placeholder='Lied / Interpret';
   console.warn('Spotify Auto-Ausfüllen:',e.message);
 }
}
