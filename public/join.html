<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fragenhagel – Beitreten</title><link rel="stylesheet" href="/style.css"></head><body><div class="wrap" style="max-width:650px;margin:8vh auto"><div class="panel" style="text-align:center"><h1 class="neon">⚡ FRAGENHAGEL</h1><p>Gib den Spielcode vom Host ein.</p><input id="room" class="input" maxlength="6" placeholder="ABC123" style="font-size:28px;text-align:center;text-transform:uppercase;width:180px"><br><br><input id="name" class="input" maxlength="24" placeholder="Dein Name" style="font-size:20px;text-align:center"><br><br><button class="btn good" onclick="join()">🎮 Beitreten</button><p id="err" class="buzz"></p></div></div><script>const q=new URLSearchParams(location.search);room.value=q.get('room')||'';name.value=q.get('name')||'';function join(){const r=room.value.trim().toUpperCase(),n=name.value.trim();if(!/^[A-F0-9]{6}$/.test(r))return err.textContent='Bitte einen gültigen 6-stelligen Spielcode eingeben.';if(!n)return err.textContent='Bitte deinen Namen eingeben.';location.href='/player.html?room='+encodeURIComponent(r)+'&name='+encodeURIComponent(n)}</script></body></html>
